{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Md. Arif Ahmed">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}
    Event Template
    {% endblock title %}</title>
    <style>
        .notification{
            display: none;
            position: absolute;
            margin-top: 40px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid black;
            padding-right: 5px;
            padding-left: 5px;
        }
        .not:hover + .notification{
            display: block;
        }
    </style>
</head>
<body class="">
    {% include "Page_Components/header.html" %}
    <main>
        {% block content %}
    
        {% endblock content %}
    </main>
    {% include "Page_Components/footer.html" %}
</body>
</html>
