{% extends "acc_base.html" %}
{% block title %}
Login
{% endblock title %}
{% block form_title %}
Member Login
{% endblock form_title %}
{% block form %}
<form method="post" class="pt-12">
    {% csrf_token %}
    <table class="mx-[70px] border-separate border-spacing-y-3 w-[10px]">
        <tr class="">
            <td class="font-bold truncate">Member Email:</td>
            <td class=""><input type="email" name="email" id="email" class="rounded-lg h-[30px] w-[300px] font-light font-sans border-1" required></td>
        </tr>
        <tr class="">
            <td class="font-bold truncate">Type Password:</td>
            <td class=""><input type="password" name="password" id="password" class="rounded-lg h-[30px] w-[300px] font-light font-sans border-1" required></td>
        </tr>
        <tr>
            <td colspan="2" class="flex justify-between"><button class="bg-white border-1 h-8 w-16 shadow-xl rounded-lg text-gray-500 font-bold" type="reset">Clear</button><button class="bg-green-300 ms-4 border-0 h-8 w-20 shadow-xl rounded-lg text-gray-500 font-bold" type="submit">Register</button></td>
        </tr>
    </table>
</form>
{% endblock form %}
