{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}
    Account Template
    {% endblock title %}</title>
</head>
    <script src="{% static 'Event_Accounts/js/script.js' %}"></script>
<body>
    <section class="flex justify-center p-[100px]">
        <div class="bg-gray-200 w-[600px] py-6 shadow-lg rounded-lg">
            <p class="text-[30px] font-sans pt-6 font-bold text-[#3e7a70]" align="center">{% block form_title %}{% endblock form_title %}</p>
            {% block form %}
            {% endblock form %}
        </div>
    </section>
</body>
</html>
